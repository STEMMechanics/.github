name: Report a problem
description: Tell us about something that is not working as expected
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping us improve the project! Do not include passwords, access tokens or personal information. Report security problems privately using the Security tab instead.
  - type: textarea
    id: goal
    attributes:
      label: What were you trying to do?
      description: A simple explanation is perfect.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can we see the problem?
      description: List the steps, one at a time. Screenshots are welcome after private details are removed.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Project version
      description: Leave this blank if you do not know.
  - type: textarea
    id: extra
    attributes:
      label: Anything else that may help?
